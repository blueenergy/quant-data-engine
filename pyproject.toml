[project]
name = "quant-data-engine"
version = "0.0.1"
description = "Unified data acquisition & quality engine for quant systems"
authors = [ {name = "blueenergy"} ]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest", "pymongo", "pydantic", "tushare" ]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant_data_engine*"]
