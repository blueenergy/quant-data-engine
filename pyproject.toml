[project]
name = "quant-data-engine"
version = "0.0.1"
description = "Unified data acquisition & quality engine for quant systems"
authors = [ {name = "blueenergy"} ]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28.0",                 # HTTP (East Money snapshots, ladder, etc.)
    "pandas>=2.0.0",                    # Data analysis and manipulation
    "numpy>=1.24.0",                    # Numerical computing
    "pymongo>=4.0.0",                   # MongoDB database
    "tushare>=1.4.0",                   # Chinese stock data
    "python-dotenv>=1.0.0",             # Environment configuration
    "PyYAML>=6.0.0",                    # YAML catalog parsing for dispatcher
    "pytdx>=1.72",                      # TDX data acquisition
    "baostock>=0.8.8",                  # Baostock data
    "boto3",                            # S3-compatible object storage uploads
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",                    # Testing framework
    "pytest-cov>=4.0.0",                # Coverage reports
    "mongomock",                        # MongoDB mock for repository/task tests
    "pymongo", 
    "pydantic", 
    "tushare" 
]

[tool.pytest.ini_options]
# src layout: tests import quant_data_engine.* (not legacy top-level adapters/…)
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
