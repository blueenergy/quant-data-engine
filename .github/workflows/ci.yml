# GitHub Actions CI for quant-data-engine
# This workflow runs tests on push and pull request events

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -v tests/

  docker:
    name: Build & Push Docker image (ghcr.io + ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/blueenergy/quant-data-engine
            crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VolcEngine (docker pull from ACR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VOLC_HOST }} >> ~/.ssh/known_hosts

      - name: Pull image and deploy
        timeout-minutes: 15
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            ${{ secrets.VOLC_USER }}@${{ secrets.VOLC_HOST }} \
            "ALIYUN_USER='${{ secrets.ALIYUN_USER }}' ALIYUN_TOKEN='${{ secrets.ALIYUN_TOKEN }}' bash -s" <<'EOF'
          set -euo pipefail

          IMAGE="crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com/wukongquant/quant-data-engine:latest"
          APP_DIR="${QUANT_DATA_ENGINE_APP_DIR:-/home/deployuser/quant-data-engine}"
          CATALOG_PATH="${DATA_PIPELINES_CATALOG_HOST_PATH:-/home/deployuser/quantFinance/config/data_pipelines_catalog.yaml}"

          log_step() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S %z')] $*"
          }

          log_step "Preparing directories"
          mkdir -p "$APP_DIR/logs"

          log_step "Logging in to Aliyun registry"
          timeout 60 docker login crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "$ALIYUN_USER" \
            -p "$ALIYUN_TOKEN"

          log_step "Pulling quant-data-engine image"
          timeout 300 docker pull "$IMAGE"

          log_step "Stopping existing quant-data-engine"
          timeout 30 docker stop -t 20 quant-data-engine 2>/dev/null || true
          timeout 30 docker rm quant-data-engine 2>/dev/null || true

          CATALOG_MOUNT_ARGS=()
          if [ -f "$CATALOG_PATH" ]; then
            CATALOG_MOUNT_ARGS=(-v "$CATALOG_PATH:/app/config/data_pipelines_catalog.yaml:ro")
          else
            log_step "Catalog not found at $CATALOG_PATH; using image defaults"
          fi

          log_step "Starting quant-data-engine"
          timeout 60 docker run -d \
            --name quant-data-engine \
            --restart unless-stopped \
            --network host \
            --env-file "$APP_DIR/.env" \
            -e TZ=Asia/Shanghai \
            -e DATA_PIPELINES_CATALOG=/app/config/data_pipelines_catalog.yaml \
            --log-driver json-file \
            --log-opt max-size=50m \
            --log-opt max-file=3 \
            -v "$APP_DIR/.env:/app/.env:ro" \
            -v "$APP_DIR/logs:/app/logs" \
            "${CATALOG_MOUNT_ARGS[@]}" \
            "$IMAGE"

          log_step "Listing deployed container"
          docker ps --filter "name=quant-data-engine"

          log_step "Pruning old images"
          timeout 120 docker image prune -f || true

          log_step "Deploy finished"
          EOF
